# Mock do contrato da CREED-23. Não é infraestrutura do produto: é andaime que
# morre quando o domínio `authentication` entrar (entrega 4 da spec).
#
# Por isso mora aqui, junto da spec, e não no docker-compose.yml do
# creed-backend — lá dentro alguém acabaria subindo o mock achando que é a API.
#
#   docker compose up
#   http://localhost:4010/api/v1/authentication/login
services:
  mock:
    image: stoplight/prism:5
    # --multiprocess=false NÃO é opcional: a imagem traz NODE_ENV=production, e nesse
    # modo o default do flag vira `true`. Aí o Prism lê `cluster.isPrimary`, que vem
    # undefined no Node 24 da imagem, e o processo morre com TypeError antes de abrir
    # a porta. Detalhe em README.md → "As duas armadilhas desse comando".
    #
    # Aqui o `command` é acrescentado ao ENTRYPOINT da imagem — semântica normal do
    # Docker — então começa em `mock`. No Render é diferente: lá o campo de comando
    # SUBSTITUI o entrypoint, e precisa do `node .../dist/index.js` na frente.
    command: mock --host 0.0.0.0 --port 4010 --multiprocess=false /openapi.yaml
    volumes:
      - ./openapi.yaml:/openapi.yaml:ro
    ports: ['4010:4010']
