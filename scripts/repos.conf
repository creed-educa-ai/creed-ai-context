# Mapa de repositórios do workspace CREED.ai Educa.
# Lido por setup-workspace.sh e setup-workspace.ps1 — formato de texto simples
# de propósito: sem jq, sem dependência extra em nenhuma plataforma.
#
# nome | slug-no-github | pasta-no-workspace | branch-preferida | tipo
#
# A branch preferida é uma preferência, não exigência: se ela não existir no
# remoto, o script clona a branch padrão e avisa.

creed-backend        | creed-educa-ai/creed-backend       | creed-backend        | dev  | backend
creed-frontend       | creed-educa-ai/creed-frontend      | creed-frontend       | dev  | frontend
creed-infrastructure | creed-educa-ai/creed-infrastructure| creed-infrastructure | dev  | infra
